[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qbox-energy"
version = "0.2.1"
description = "Local Q-Box energy MCP bridge and Ollama advisor"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<0.29", "pydantic-settings>=2.7,<3", "uvicorn>=0.34,<1", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
include = ["qbox*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
